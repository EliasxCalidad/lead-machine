name: Lead Machine Pipeline

on:
  schedule:
    # Scrapa, analysera och generera mail — varje dag 07:00 svensk tid (05:00 UTC)
    - cron: '0 5 * * *'
    # Skicka omgång 1 — 09:00 svensk tid
    - cron: '0 7 * * *'
    # Skicka omgång 2 — 12:00 svensk tid
    - cron: '0 10 * * *'
    # Skicka omgång 3 — 15:00 svensk tid
    - cron: '0 13 * * *'
  workflow_dispatch: # Tillåter manuell körning från GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt

      - name: Run full pipeline (scrape + analyze + generate) at 07:00
        if: github.event.schedule == '0 5 * * *'
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd pipeline
          python main.py --scrape
          python main.py --analyze
          python main.py --generate

      - name: Send emails (omgång 1 — 09:00)
        if: github.event.schedule == '0 7 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd pipeline
          python -c "from sender import run_sender; run_sender(max_emails=3)"

      - name: Send emails (omgång 2 — 12:00)
        if: github.event.schedule == '0 10 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd pipeline
          python -c "from sender import run_sender; run_sender(max_emails=6)"

      - name: Send emails (omgång 3 — 15:00)
        if: github.event.schedule == '0 13 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd pipeline
          python -c "from sender import run_sender; run_sender(max_emails=10)"
